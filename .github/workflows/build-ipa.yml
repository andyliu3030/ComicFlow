# ComicFlow iOS 12 编译脚本
# 用法：fork https://github.com/swisspol/ComicFlow 后，
# 在仓库中新建文件 .github/workflows/build-ipa.yml，把本文件内容粘贴进去，
# 然后在仓库的 Actions 页面手动运行（Run workflow）。
# 产物为未签名 .ipa，需用 Sideloadly / AltStore 自签后安装到设备。
#
# 注意：不要用 macos-13，GitHub 已于 2025 年底下线该镜像，
# 指向它的任务会永远卡在排队。当前可用的是 macos-15。

name: Build ComicFlow IPA for iOS 12

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Use Xcode 16 (supports iOS 12 deployment target)
        run: |
          ls /Applications | grep -i xcode
          XCODE_APP=$(ls -d /Applications/Xcode_16*.app 2>/dev/null | sort | tail -1)
          if [ -z "$XCODE_APP" ]; then
            XCODE_APP=$(ls -d /Applications/Xcode_15*.app 2>/dev/null | sort | tail -1)
          fi
          if [ -n "$XCODE_APP" ]; then
            echo "Using $XCODE_APP"
            sudo xcode-select -s "$XCODE_APP/Contents/Developer"
          else
            echo "WARNING: No Xcode 15/16 found, using default Xcode (may not support iOS 12 target)"
          fi
          xcodebuild -version

      - name: Build ComicFlow (unsigned, target iOS 12)
        run: |
          # 说明：
          # - 不用 -derivedDataPath：新版 xcodebuild 要求它必须搭配 -scheme，
          #   而这个老工程没有共享 scheme，改用默认 DerivedData 路径。
          # - CLANG_CXX_LANGUAGE_STANDARD=c++14：2016 年自带的 unrar 老代码用了
          #   C++17 已删除的 register 关键字，默认标准下会直接编译报错。
          rm -rf ~/Library/Developer/Xcode/DerivedData
          xcodebuild \
            -project ComicFlow.xcodeproj \
            -target ComicFlow \
            -sdk iphoneos \
            -configuration Release \
            IPHONEOS_DEPLOYMENT_TARGET=12.0 \
            CLANG_CXX_LANGUAGE_STANDARD=c++14 \
            CODE_SIGNING_ALLOWED=NO

      - name: Package unsigned IPA
        run: |
          APP_PATH=$(find ~/Library/Developer/Xcode/DerivedData -name "ComicFlow.app" -path "*Release-iphoneos*" | head -1)
          echo "App bundle: $APP_PATH"
          test -n "$APP_PATH"
          rm -rf Payload && mkdir Payload
          cp -R "$APP_PATH" Payload/
          rm -f ComicFlow-iOS12-unsigned.ipa
          zip -qry ComicFlow-iOS12-unsigned.ipa Payload
          ls -lh ComicFlow-iOS12-unsigned.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: ComicFlow-iOS12-unsigned
          path: ComicFlow-iOS12-unsigned.ipa
          if-no-files-found: error
